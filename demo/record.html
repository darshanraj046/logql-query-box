<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>logql-query-box recording stage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=block" rel="stylesheet" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f6f9;
      }

      .stage {
        box-sizing: border-box;
        height: 100%;
        padding: 30px 36px 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        color: #18202e;
      }

      .caption {
        margin: 0;
        font-size: 25px;
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .caption-sub {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.4;
        color: #5d697c;
        font-weight: 400;
        letter-spacing: 0;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e7ef;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 12px 32px rgba(20, 30, 50, 0.08);
      }

      .code {
        margin: 0;
        padding: 18px 20px;
        border-radius: 12px;
        background: #151b29;
        color: #e6eaf2;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 19px;
        line-height: 1.65;
        white-space: pre;
      }

      .code-label {
        margin: 0 0 8px;
        font-size: 13px;
        color: #5d697c;
      }

      .pains {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pains li {
        padding: 5px 12px;
        border-radius: 999px;
        background: #fdecea;
        color: #b42318;
        font-size: 14px;
        font-weight: 500;
      }

      .end {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
      }

      .end h1 {
        margin: 0;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .end p {
        margin: 0;
        font-size: 18px;
        color: #5d697c;
      }

      .end code {
        margin-top: 10px;
        padding: 12px 22px;
        border-radius: 10px;
        background: #151b29;
        color: #e6eaf2;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 18px;
      }

      .dots {
        margin-top: auto;
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #cbd3e0;
      }

      .dots i.on {
        background: #2563eb;
      }

      .key {
        position: fixed;
        right: 36px;
        bottom: 22px;
        padding: 5px 14px;
        border-radius: 8px;
        border: 1px solid #cbd3e0;
        border-bottom-width: 3px;
        background: #ffffff;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        color: #18202e;
      }

      .pointer {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 2147483647;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./record.tsx"></script>
  </body>
</html>
