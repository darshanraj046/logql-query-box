auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3199
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9199
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA:-/tmp/logql-query-box-loki}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA:-/tmp/logql-query-box-loki}/chunks
      rules_directory: ${LOKI_DATA:-/tmp/logql-query-box-loki}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7999

ingester:
  wal:
    enabled: false

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  discover_service_name: []
  discover_log_levels: false
  reject_old_samples: false
  max_query_series: 100000
  max_entries_limit_per_query: 100000
  query_timeout: 30s

query_range:
  cache_results: false

analytics:
  reporting_enabled: false
